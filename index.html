<!DOCTYPE html>
<html lang="he">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Login – Personal Budget</title>
		<link rel="stylesheet" href="assets/style.css?v=20260717">
		
	</head>
	<body>
		<script>
			if (localStorage.getItem('theme') === 'dark') {
				document.body.classList.add('dark-mode');
			}
		</script>

		<div class="split-screen-wrapper">
    
			
			<div class="welcome-text">
				<h1>ניהול התקציב שלך<br>מתחיל כאן</h1>
				<p>הפלטפורמה הפשוטה למעקב אחר ההכנסות, ההוצאות והיעדים שלך</p>
			</div>
		

		<div class="container">
			<h1>ברוכים הבאים!</h1>
			<h2>התחברות</h2>
			<input id="email" type="email" placeholder="אימייל">
				<input id="password" type="password" placeholder="סיסמה">
					<button onclick="login()">התחבר</button>
					<p>
						אין לך חשבון? <a href="register.html">הירשם כאן</a>
					</p>
					<button id="login-theme-btn" onclick="toggleDarkMode()" class="theme-btn">🌙</button>
				</div>

		<script src="assets/script.js?v=20260717"></script>
		
	</body>
</html>
